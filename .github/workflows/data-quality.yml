name: Data Quality

on:
  schedule:
    # 매일 오전 9시 20분 KST
    - cron: '20 0 * * *'
  workflow_dispatch:

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run data quality audit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_QUALITY_RESULT_PATH: data-quality-result.json
        run: npm run audit:data-quality

      - name: Notify data quality result
        if: always()
        env:
          DATA_QUALITY_RESULT_PATH: data-quality-result.json
          DATA_QUALITY_SLACK_WEBHOOK_URL: ${{ secrets.DATA_QUALITY_SLACK_WEBHOOK_URL }}
        run: npm run audit:data-quality:notify
